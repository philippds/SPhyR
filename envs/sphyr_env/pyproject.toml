[project]
name = "openenv-sphyr"
version = "0.1.0"
description = "SPhyR: a spatial-physical reasoning benchmark, as an OpenEnv environment"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "anonymized", email = "anonymized"}
]
dependencies = [
    "openenv>=0.4.1",
    # The task builder and the physics-based scorer both live in the sphyr
    # library at the root of this repository, which installs this package
    # alongside it: run `uv sync` there rather than installing this one.
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "datasets>=3.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
